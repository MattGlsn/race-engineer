[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "race-engineer-bridge"
version = "0.1.0"
description = "Python telemetry bridge for Race Engineer (iRacing SDK)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyirsdk>=1.3.5",
    "PyYAML>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "numpy>=2.0",
    "sounddevice>=0.5",
    "httpx>=0.28",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.28",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["race_engineer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
